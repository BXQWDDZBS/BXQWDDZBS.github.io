# 1. 给这个自动化流程起个名字（随便起，叫“打包博客”也行）
name: Deploy Hugo site to Pages

# 2. 触发条件：只要我把代码 push 到 main 分支，这个流程就会自动执行
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 3. 具体要执行的任务
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      # 【修正一】安装 Go 语言环境（此处正确，保留不动）
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # 【修正二】**这里是大坑**：原错误写法是 actions/hugo@v3
      # 必须改成社区维护的 peaceiris/actions-hugo@v3
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      
      # 执行编译命令
      - run: hugo --minify
      
      # 把生成的 public 文件夹打包上传
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      # 【修正三】部署也是用官方标准写法，此处正确
      - uses: actions/deploy-pages@v4